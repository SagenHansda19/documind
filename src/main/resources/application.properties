spring.application.name=documind-backend
server.port=${PORT:8080}

# PostgreSQL Configuration
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DB_USER:${DB_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# AI Provider Configuration (auto | groq | gemini)
ai.provider=${AI_PROVIDER:auto}

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.chat.model=gemini-3.8-flash
gemini.embedding.model=gemini-embedding-001
gemini.embedding.dimension=768

# Groq Cloud Configuration
groq.api.key=${GROQ_API_KEY:}
groq.base.url=https://api.groq.com/openai/v1
groq.chat.model=${GROQ_CHAT_MODEL:openai/gpt-oss-120b}